<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0a0e1b">
    <title>図案のクレジット · 月下の招待状</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-width:320px;background:#0a0e1b;color:#eee4d4;font:15px/1.9 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
      main{max-width:650px;margin:12vh auto;padding:28px}
      h1{font:400 30px/1.5 "Hiragino Mincho ProN","Yu Mincho",Georgia,serif;letter-spacing:.1em}
      p{color:#aaa8b9}a{color:#d4b7ca;text-underline-offset:4px}a:focus-visible,button:focus-visible{outline:2px solid #d4b7ca;outline-offset:5px}
      .language-switch{position:fixed;right:24px;top:20px;display:flex;gap:2px;padding:3px;border:1px solid #d4b7ca30;border-radius:5px;background:#151526ed;z-index:2}
      .language-switch button{font:inherit;font-size:11px;line-height:1.3;min-height:36px;padding:8px 12px;border:0;border-radius:3px;background:transparent;color:#928a9e;cursor:pointer}
      .language-switch button[aria-pressed="true"]{background:#d7c8da;color:#252333}.language-switch button:hover{color:#eee4d4}.language-switch button[aria-pressed="true"]:hover{color:#252333}
      @media(max-width:640px){main{margin-top:95px;padding:26px}h1{font-size:25px}.language-switch{right:17px;top:16px}.language-switch button{min-height:36px;padding:8px 10px}}
    </style>
  </head>
  <body>
    <nav class="language-switch" aria-label="言語を選択" id="language-switch">
      <button type="button" lang="ja" data-language="ja" aria-pressed="true">日本語</button>
      <button type="button" lang="zh-CN" data-language="zh" aria-pressed="false">中文</button>
    </nav>
    <main>
      <a href="/" data-copy="back">← 月下の招待状へ戻る</a>
      <h1 data-copy="heading">図案のクレジット</h1>
      <p><span data-copy="sourceBefore">このサイトのロゴには、</span><a href="https://commons.wikimedia.org/wiki/File:Kaito_Kid_signature.svg">Kaito Kid signature</a><span data-copy="authorBefore">を使用しています。作者は</span><a href="https://commons.wikimedia.org/wiki/User:DaniDF1995">DaniDF1995</a><span data-copy="licenseBefore">です。</span><a href="https://creativecommons.org/licenses/by/3.0/">Creative Commons Attribution 3.0</a><span data-copy="licenseAfter">ライセンスに基づいて使用しています。</span></p>
      <p data-copy="changes">このサイトでは、図案の表示サイズと色を調整しています。</p>
      <p><span data-copy="moonBefore">月面テクスチャ：</span><a href="https://svs.gsfc.nasa.gov/4720/">NASA's Scientific Visualization Studio · CGI Moon Kit</a><span data-copy="moonAfter">（LRO／LROC／LOLA）。月面の色と標高データを使用しています。</span></p>
    </main>
    <script>
      // This public page is copied unchanged by Vite, so it keeps a small
      // standalone locale table and shares only the saved language preference.
      const key = 'moonlight-language';
      const copy = {
        ja: {
          title: '図案のクレジット · 月下の招待状', language: '言語を選択',
          back: '← 月下の招待状へ戻る', heading: '図案のクレジット',
          sourceBefore: 'このサイトのロゴには、', authorBefore: 'を使用しています。作者は',
          licenseBefore: 'です。', licenseAfter: 'ライセンスに基づいて使用しています。',
          changes: 'このサイトでは、図案の表示サイズと色を調整しています。',
          moonBefore: '月面テクスチャ：', moonAfter: '（LRO／LROC／LOLA）。月面の色と標高データを使用しています。',
        },
        zh: {
          title: '图案署名 · 月下邀约', language: '选择语言',
          back: '← 回到月下邀约', heading: '图案署名',
          sourceBefore: '网站标志采用 ', authorBefore: '，作者为 ',
          licenseBefore: '，按 ', licenseAfter: ' 许可使用。',
          changes: '图案在本网站中调整了显示尺寸和颜色。',
          moonBefore: '月面贴图：', moonAfter: '（LRO／LROC／LOLA），使用月面颜色与地形高度数据。',
        },
      };
      function applyLanguage(language, persist = true) {
        const locale = Object.hasOwn(copy, language) ? language : 'ja';
        const text = copy[locale];
        document.documentElement.lang = locale === 'zh' ? 'zh-CN' : locale;
        document.body.dataset.language = locale;
        document.title = text.title;
        document.getElementById('language-switch').setAttribute('aria-label', text.language);
        document.querySelectorAll('[data-copy]').forEach(element => { element.textContent = text[element.dataset.copy]; });
        document.querySelectorAll('[data-language]').forEach(button => { button.setAttribute('aria-pressed', String(button.dataset.language === locale)); });
        if (persist) { try { localStorage.setItem(key, locale); } catch {} }
      }
      let language = 'ja';
      try { language = localStorage.getItem(key) || 'ja'; } catch {}
      applyLanguage(language, false);
      document.querySelectorAll('[data-language]').forEach(button => { button.addEventListener('click', () => applyLanguage(button.dataset.language)); });
      window.addEventListener('storage', event => { if (event.key === key) applyLanguage(event.newValue, false); });
    </script>
  </body>
</html>
